<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="판매기록">
<meta name="theme-color" content="#1f2a37">
<link rel="manifest" href="manifest.json">
<title>심학산 판매기록</title>
<style>
  :root{--bg:#f6f2ee;--ink:#1f2a37;--accent:#e2735b;--muted:#7a7a7a;--card:#fff;--line:#e6dfd8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
       padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px)}
  header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  header h1{font-size:18px;margin:0;flex:1}
  input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
  #place{width:100%;margin-bottom:10px}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .sum div{background:var(--ink);color:#fff;border-radius:12px;padding:10px;text-align:center}
  .sum b{display:block;font-size:22px}
  .sum span{font-size:12px;opacity:.8}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;border:0;border-radius:14px;cursor:pointer}
  .item{background:var(--card);padding:14px 10px;min-height:84px;box-shadow:0 1px 0 var(--line);text-align:left;color:var(--ink)}
  .item:active{transform:scale(.97);background:#fde9e3}
  .item b{display:block;font-size:17px}
  .item small{color:var(--muted);font-size:13px}
  .item .p{color:var(--accent);font-weight:700;font-size:16px}
  .wide{grid-column:1/-1;background:var(--accent);color:#fff}
  .wide b,.wide small,.wide .p{color:#fff}
  h2{font-size:15px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
  ul{list-style:none;padding:0;margin:0;background:#fff;border-radius:12px}
  li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
  li:last-child{border:0}
  li .t{color:var(--muted);width:44px}
  li .n{flex:1}
  li .a{font-weight:700}
  li button{background:none;color:#c0392b;font-size:18px;padding:0 4px}
  .empty{padding:14px;color:var(--muted);text-align:center}
  .bar{display:flex;gap:8px;margin-top:14px}
  .bar button{flex:1;padding:12px;background:var(--ink);color:#fff}
  .bar button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,360px)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .row{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
  .step{display:flex;align-items:center;gap:10px}
  .step button{width:44px;height:44px;background:var(--bg);font-size:22px}
  .step output{min-width:28px;text-align:center;font-size:20px;font-weight:700}
  #amt{width:130px;text-align:right;font-size:18px}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
         background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;display:none;gap:12px;align-items:center;z-index:9}
  #toast button{background:var(--accent);color:#fff;padding:6px 10px;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>심학산 판매기록</h1>
  <input type="date" id="day">
</header>
<input id="place" placeholder="장소 (예: 롱런마켓)">

<div class="sum">
  <div><b id="s500">0</b><span>500ml</span></div>
  <div><b id="s190">0</b><span>190ml</span></div>
  <div><b id="sAmt">0</b><span>매출(원)</span></div>
</div>

<div class="grid" id="menu"></div>

<h2><span>거래 내역 <small id="cnt"></small></span></h2>
<ul id="list"></ul>

<div class="bar">
  <button id="share">CSV 내보내기</button>
  <button class="sec" id="copy">복사</button>
</div>

<dialog id="dlg">
  <h3 style="margin:0 0 6px">직접 입력</h3>
  <div class="row"><span>500ml</span><div class="step"><button data-k="a" data-d="-1">−</button><output id="oa">0</output><button data-k="a" data-d="1">+</button></div></div>
  <div class="row"><span>190ml</span><div class="step"><button data-k="b" data-d="-1">−</button><output id="ob">0</output><button data-k="b" data-d="1">+</button></div></div>
  <div class="row"><span>받은 금액</span><input id="amt" type="number" inputmode="numeric"></div>
  <div class="bar"><button class="sec" id="cancel">취소</button><button id="ok">기록</button></div>
</dialog>

<div id="toast"><span id="tmsg"></span><button id="undo">취소</button></div>

<script>
const P500=7000,P190=4000;
const MENU=[
  {n:"500ml 단품",a:1,b:0,p:7000},
  {n:"190ml 단품",a:0,b:1,p:4000},
  {n:"오빠와 함께",a:1,b:1,p:10000},
  {n:"반주는 가볍게",a:0,b:3,p:10000},
  {n:"둘이 함께",a:3,b:0,p:20000},
  {n:"회식하는 날",a:5,b:0,p:30000},
];
const $=id=>document.getElementById(id);
const won=n=>n.toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const KEY="simhak_pos_v1";
let db={};
try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("저장 실패: 저장 공간을 확인하세요")}};
const dayData=()=>{const d=$('day').value;return db[d]||(db[d]={place:"",tx:[]})};

function render(){
  const D=dayData();
  $('place').value=D.place||"";
  let a=0,b=0,s=0;
  const L=$('list');L.innerHTML="";
  [...D.tx].reverse().forEach((t,i)=>{
    a+=t.a;b+=t.b;s+=t.p;
    const idx=D.tx.length-1-i;
    const li=document.createElement('li');
    li.innerHTML=`<span class="t">${t.time}</span><span class="n">${t.n}<br><small style="color:#7a7a7a">500×${t.a} · 190×${t.b}</small></span><span class="a">${won(t.p)}</span><button aria-label="삭제">✕</button>`;
    li.querySelector('button').onclick=()=>{if(confirm(`${t.time} ${t.n} ${won(t.p)}원 삭제할까요?`)){D.tx.splice(idx,1);save();render()}};
    L.appendChild(li);
  });
  if(!D.tx.length)L.innerHTML='<li class="empty">아직 기록이 없습니다</li>';
  $('s500').textContent=a;$('s190').textContent=b;$('sAmt').textContent=won(s);
  $('cnt').textContent=D.tx.length?`${D.tx.length}건`:"";
}

let toastTimer;
function add(n,a,b,p){
  const D=dayData();const d=new Date();
  D.tx.push({time:`${pad(d.getHours())}:${pad(d.getMinutes())}`,n,a,b,p});
  save();render();
  if(navigator.vibrate)navigator.vibrate(30);
  $('tmsg').textContent=`${n} ${won(p)}원 기록`;
  $('toast').style.display='flex';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4000);
}
$('undo').onclick=()=>{dayData().tx.pop();save();render();$('toast').style.display='none'};

MENU.forEach(m=>{
  const bt=document.createElement('button');bt.className='item';
  bt.innerHTML=`<b>${m.n}</b><small>500×${m.a} · 190×${m.b}</small><div class="p">${won(m.p)}원</div>`;
  bt.onclick=()=>add(m.n,m.a,m.b,m.p);
  $('menu').appendChild(bt);
});
const custom=document.createElement('button');custom.className='item wide';
custom.innerHTML='<b>직접 입력</b><small>병수·금액 직접 지정</small>';
$('menu').appendChild(custom);

let ca=0,cb=0,amtEdited=false;
const upd=()=>{$('oa').textContent=ca;$('ob').textContent=cb;if(!amtEdited)$('amt').value=ca*P500+cb*P190};
custom.onclick=()=>{ca=0;cb=0;amtEdited=false;upd();$('dlg').showModal()};
document.querySelectorAll('.step button').forEach(x=>x.onclick=()=>{
  const d=+x.dataset.d;if(x.dataset.k==='a')ca=Math.max(0,ca+d);else cb=Math.max(0,cb+d);upd()});
$('amt').oninput=()=>amtEdited=true;
$('cancel').onclick=()=>$('dlg').close();
$('ok').onclick=()=>{const p=parseInt($('amt').value,10)||0;if(!ca&&!cb){alert("병수를 입력하세요");return}
  add("직접",ca,cb,p);$('dlg').close()};

$('place').oninput=e=>{dayData().place=e.target.value;save()};
$('day').value=today();
$('day').onchange=render;

function csv(){
  const d=$('day').value,D=dayData();
  const esc=s=>/[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;
  return "날짜,시각,장소,메뉴,500ml,190ml,금액\n"+
    D.tx.map(t=>[d,t.time,esc(D.place||""),esc(t.n),t.a,t.b,t.p].join(",")).join("\n")+"\n";
}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(csv());alert("복사했습니다")}catch(e){prompt("아래 내용을 복사하세요",csv())}};
$('share').onclick=async()=>{
  const name=`현장판매_${$('day').value}.csv`;
  const file=new File(["﻿"+csv()],name,{type:"text/csv"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e.name==="AbortError")return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
};

render();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
